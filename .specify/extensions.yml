installed:
- jit
settings:
  auto_execute_hooks: true
hooks:
  after_tasks:
  - extension: jit
    command: speckit.jit.issues
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.jit.issues?
    description: Create one GitHub issue per task
    condition: null
  after_converge:
  - extension: jit
    command: speckit.jit.issues
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.jit.issues?
    description: Create issues for the tasks /speckit-converge added
    condition: null
  after_analyze:
  - extension: jit
    command: speckit.jit.analyzed
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.jit.analyzed?
    description: Record that analysis ran (required on level full)
    condition: null
  before_implement:
  - extension: jit
    command: speckit.jit.branch
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.jit.branch?
    description: Switch to the task's branch
    condition: null
  after_implement:
  - extension: jit
    command: speckit.jit.pr
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.jit.pr?
    description: Open the task's pull request
    condition: null
