installed:
- landspec
settings:
  auto_execute_hooks: true
hooks:
  after_tasks:
  - extension: landspec
    command: speckit.landspec.issues
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.issues?
    description: Create one GitHub issue per task
    condition: null
  after_converge:
  - extension: landspec
    command: speckit.landspec.issues
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.issues?
    description: Create issues for the tasks /speckit-converge added
    condition: null
  after_analyze:
  - extension: landspec
    command: speckit.landspec.analyzed
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.analyzed?
    description: Record that analysis ran (required on level full)
    condition: null
  before_implement:
  - extension: landspec
    command: speckit.landspec.branch
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.branch?
    description: Switch to the task's branch
    condition: null
  after_implement:
  - extension: landspec
    command: speckit.landspec.pr
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.pr?
    description: Open the task's pull request
    condition: null
