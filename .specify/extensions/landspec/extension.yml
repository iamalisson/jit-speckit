schema_version: "1.0"

extension:
  id: landspec
  name: "landspec"
  version: "2.3.0"
  description: "One task = one issue = one branch = one PR, with defaults sized by project complexity"
  author: iamalisson
  repository: https://github.com/iamalisson/landspec
  license: MIT

requires:
  speckit_version: ">=1.2.0"
  tools:
    - name: git
      required: true
    - name: gh
      required: true
      description: "GitHub CLI, used for issues and pull requests"

provides:
  commands:
    - name: speckit.landspec.issues
      file: commands/issues.md
      description: "Create one GitHub issue per task and open the spec PR"
    - name: speckit.landspec.analyzed
      file: commands/analyzed.md
      description: "Record that analysis ran on the current tasks"
    - name: speckit.landspec.branch
      file: commands/branch.md
      description: "Switch to the task's branch before implementing"
    - name: speckit.landspec.pr
      file: commands/pr.md
      description: "Commit, push and open the task's pull request"
    - name: speckit.landspec.review
      file: commands/review.md
      description: "Independent review of the branch or the plan by a fresh reader grounded in the whole repository"

hooks:
  after_tasks:
    command: speckit.landspec.issues
    optional: false
    description: "Create one GitHub issue per task"
  after_converge:
    command: speckit.landspec.issues
    optional: false
    description: "Create issues for the tasks /speckit-converge added"
  after_analyze:
    command: speckit.landspec.analyzed
    optional: false
    description: "Record that analysis ran (required on level full)"
  before_implement:
    command: speckit.landspec.branch
    optional: false
    description: "Switch to the task's branch"
  after_implement:
    command: speckit.landspec.pr
    optional: false
    description: "Open the task's pull request"

tags: ["github", "issues", "branching", "workflow", "best-practices"]
