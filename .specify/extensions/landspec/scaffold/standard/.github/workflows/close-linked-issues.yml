# landspec: managed file. /landspec:level re-creates it while this line stays; delete the line to keep your own edits.
# GitHub only auto-closes "Closes #N" issues when a PR merges into the default branch.
# Task PRs merge into develop/staging, so this closes them on merge there too.
name: Close linked issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Close every linked issue, then fail the job if any could not be closed.
          failed=""
          for n in $(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY" | grep -oE '[0-9]+' | sort -u); do
            gh issue close "$n" --repo "$REPO" --comment "Closed by #$PR (merged into $BASE)." || failed+=" #$n"
          done
          if [[ -n "$failed" ]]; then echo "could not close:$failed (see the errors above); close them by hand" >&2; exit 1; fi
