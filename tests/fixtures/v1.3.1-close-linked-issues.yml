# GitHub only auto-closes "Closes #N" issues when a PR merges into the default branch.
# Task PRs merge into develop/staging, so this closes them on merge there too.
name: Close linked issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          for n in $(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY" | grep -oE '[0-9]+' | sort -u); do
            gh issue close "$n" --repo "$REPO" --comment "Closed by #$PR (merged into $BASE)." || true
          done
