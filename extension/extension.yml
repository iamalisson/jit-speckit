schema_version: "1.0"

extension:
  id: jit
  name: "jit-speckit"
  version: "1.3.0"
  description: "One task = one issue = one branch = one PR, with defaults sized by project complexity"
  author: iamalisson
  repository: https://github.com/iamalisson/jit-speckit
  license: MIT

requires:
  speckit_version: ">=1.2.0"
  tools:
    - name: git
      required: true
    - name: gh
      required: true
      description: "GitHub CLI, used for issues and pull requests"

provides:
  commands:
    - name: speckit.jit.issues
      file: commands/issues.md
      description: "Create one GitHub issue per task and open the spec PR"
    - name: speckit.jit.analyzed
      file: commands/analyzed.md
      description: "Record that analysis ran on the current tasks"
    - name: speckit.jit.branch
      file: commands/branch.md
      description: "Switch to the task's branch before implementing"
    - name: speckit.jit.pr
      file: commands/pr.md
      description: "Commit, push and open the task's pull request"

hooks:
  after_tasks:
    command: speckit.jit.issues
    optional: false
    description: "Create one GitHub issue per task"
  after_analyze:
    command: speckit.jit.analyzed
    optional: false
    description: "Record that analysis ran (required on level full)"
  before_implement:
    command: speckit.jit.branch
    optional: false
    description: "Switch to the task's branch"
  after_implement:
    command: speckit.jit.pr
    optional: false
    description: "Open the task's pull request"

tags: ["github", "issues", "branching", "workflow", "best-practices"]
